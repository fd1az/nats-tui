version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Argentina/Buenos_Aires
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/Argentina/Buenos_Aires
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

